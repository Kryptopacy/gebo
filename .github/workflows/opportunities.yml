name: opportunities

# Refreshes the opportunity surface: PancakeSwap V3 pool ticks and liquidity,
# Venus supply/borrow rates and collateral factors. These move continuously, so
# a stale surface is a wrong surface.

on:
  # Manual-only: pg_cron owns the live cadence (docs/OPERATIONS.md §3); a
  # schedule here would double-index once repo Actions billing unlocks.
  workflow_dispatch:

concurrency:
  group: opportunities
  cancel-in-progress: true

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Index PancakeSwap V3 and Venus
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BSC_MAINNET_RPC: ${{ secrets.BSC_MAINNET_RPC }}
        run: npx tsx scripts/index-opportunities.ts
