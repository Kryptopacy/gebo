name: registry-sync

# Incremental registry census.
#
# The registry only grows and existing tokenURIs rarely change, so a scheduled
# run reads the few hundred tokens above the stored high-water mark rather than
# re-reading 270k. It then calls refresh_census_stats(), which recomputes the
# funnel from registry_tokens — so the figures on the site are a SQL aggregate
# over stored rows, never a hardcoded constant.

on:
  # Manual-only. pg_cron is the live scheduler (see docs/OPERATIONS.md §3); a
  # cron trigger here would double-schedule the same pipeline the moment repo
  # Actions billing unlocks - same jobs, twice the crawl against third-party
  # endpoints. Run this by hand only when pg_cron itself is broken.
  workflow_dispatch:
    inputs:
      backfill:
        description: "Reload registry_tokens from local NDJSON instead of reading chain"
        required: false
        default: false
        type: boolean

concurrency:
  group: registry-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Sync registry and refresh funnel
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BSC_MAINNET_RPC: ${{ secrets.BSC_MAINNET_RPC }}
          SYNC_MAX_NEW: "5000"
        run: |
          if [ "${{ github.event.inputs.backfill }}" = "true" ]; then
            npx tsx scripts/sync-registry.ts --backfill
          else
            npx tsx scripts/sync-registry.ts
          fi
